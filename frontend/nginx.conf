server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Cererile către API merg la containerul backend-ului (serviciul „api” din docker-compose).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Aplicație single-page: orice altă rută (ex. /calendar, /reset-password) încarcă index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
