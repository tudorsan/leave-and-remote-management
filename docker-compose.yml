# Pornește toată aplicația (SQL Server + API .NET + frontend Vue) cu o singură comandă:
#
#   docker compose up --build
#
# Aplicația: http://localhost:8080   ·   API (OpenAPI): http://localhost:8081/openapi/v1.json
# Datele demo și migrările se creează automat la prima pornire. Emailurile simulate apar în log-ul serviciului „api”:
#
#   docker compose logs -f api
#
# Parolele de mai jos sunt doar pentru demonstrație; se pot schimba prin variabile de mediu sau un fișier .env.
name: ritm

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Ritm_Demo_2026!}"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      # API-ul pornește abia după ce SQL Server răspunde.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: ./backend
      dockerfile: LeaveRemote.Api/Dockerfile
    environment:
      # Development: populează datele demo și publică contractul OpenAPI.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db;Database=LeaveRemoteDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Ritm_Demo_2026!};TrustServerCertificate=True;Connect Timeout=60;"
      Jwt__Key: "${JWT_KEY:-docker-demo-signing-key-change-me-0123456789abcdef}"
      # Linkurile din emailurile de resetare a parolei duc la frontend-ul servit de Docker.
      Frontend__BaseUrl: "http://localhost:8080"
      # Aplicația folosește JWT, nu cookie-uri protejate; avertismentele despre cheile Data Protection
      # (salvate doar în container) nu o privesc.
      Logging__LogLevel__Microsoft.AspNetCore.DataProtection: "Error"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db-data:
